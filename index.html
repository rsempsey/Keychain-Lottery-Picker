<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Backyard - Keychain Number Picker</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #ffffff;
    width: 100%;
    height: 100vh;
    aspect-ratio: 9 / 16;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    margin: 0 auto;
  }
  h1 { display: none; }
  .logo-wrap {
    width: 260px;
    height: 260px;
    margin: 0 auto;
  }
  .board-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #f4f4f4;
    border-radius: 16px;
    padding: 22px 28px;
    border: 3px solid #d0d0d0;
    position: relative;
    overflow: hidden;
  }
  .letter-A {
    font-size: 52px;
    font-weight: 700;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: #111111;
  }
  #reels { display: flex; gap: 6px; }
  .flip-unit { perspective: 400px; width: 58px; height: 82px; position: relative; }
  .flip-card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(0deg); }
  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; font-weight: 700;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #ffffff; border-radius: 7px; color: #111111;
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
  }
  .flip-face::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0));
    border-radius: 5px 5px 0 0;
  }
  .flip-face::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
    background: linear-gradient(to top, rgba(0,0,0,0.05), rgba(0,0,0,0));
    border-radius: 0 0 5px 5px;
  }
  .flip-back { transform: rotateX(180deg); }
  .flip-hinge {
    position: absolute; top: 50%; left: 3px; right: 3px; height: 3px;
    background: rgba(0,0,0,0.35); pointer-events: none; z-index: 2;
    transform: translateY(-1.5px);
  }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  button#spinBtn {
    width: 260px; height: 64px; border-radius: 10px;
    background: #111111; color: #ffffff; border: none;
    font-size: 22px; font-weight: 500; cursor: pointer;
  }
  button#spinBtn:disabled { opacity: 0.5; cursor: default; }
  button#spinBtn:hover:not(:disabled) { background: #2a2a2a; }
  label {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; color: #6b6b6b; cursor: pointer;
  }
  label input[type="checkbox"] { width: 20px; height: 20px; }
  #history {
    font-size: 16px; color: #6b6b6b; text-align: center;
    max-width: 420px; min-height: 22px;
  }
  @keyframes bd-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(180px) rotate(360deg); opacity: 0; }
  }
</style>

  </div>
  <div class="board-row" id="confettiZone">
    <span class="letter-A">A</span>
    <div id="reels"></div>
  </div>
  <div class="controls">
    <button id="spinBtn">Spin for a winner</button>
    <label><input type="checkbox" id="noRepeat" checked style="width:auto"> Don't repeat winners</label>
    <div id="history"></div>
  </div>
</div>
<script>
const reelsEl = document.getElementById('reels');
function makeDigitUnit(){
  const unit = document.createElement('div');
  unit.className = 'flip-unit';
  const card = document.createElement('div');
  card.className = 'flip-card';
  const front = document.createElement('div');
  front.className = 'flip-face';
  front.textContent = '0';
  const back = document.createElement('div');
  back.className = 'flip-face flip-back';
  back.textContent = '0';
  card.appendChild(front);
  card.appendChild(back);
  const hinge = document.createElement('div');
  hinge.className = 'flip-hinge';
  unit.appendChild(card);
  unit.appendChild(hinge);
  reelsEl.appendChild(unit);
  return {
    card, front, back,
    flipTo(digit, duration, cb){
      this.back.textContent = digit;
      this.card.style.transition = `transform ${duration}ms ease-in`;
      this.card.style.transform = 'rotateX(-180deg)';
      const done = () => {
        this.card.removeEventListener('transitionend', done);
        this.card.style.transition = 'none';
        this.card.style.transform = 'rotateX(0deg)';
        this.front.textContent = digit;
        void this.card.offsetHeight;
        if (cb) cb();
      };
      this.card.addEventListener('transitionend', done);
    }
  };
}
const digitUnits = [makeDigitUnit(), makeDigitUnit(), makeDigitUnit(), makeDigitUnit()];
let picked = JSON.parse(localStorage.getItem('backyardPicked') || '[]');
const btn = document.getElementById('spinBtn');
const historyEl = document.getElementById('history');
const confettiZone = document.getElementById('confettiZone');
const confettiColors = ['#EF9F27','#D85A30','#1D9E75','#D4537E'];
function fmt(n){ return 'A' + String(n).padStart(4,'0'); }
function renderHistory(){
  historyEl.textContent = picked.length ? ('Picked: ' + picked.map(fmt).join(', ')) : '';
}
function burstConfetti(){
  for (let c = 0; c < 24; c++) {
    const piece = document.createElement('div');
    const left = 30 + Math.random() * 40;
    const size = 5 + Math.random() * 4;
    const color = confettiColors[c % confettiColors.length];
    piece.style.cssText = `position:absolute;left:${left}%;top:0;width:${size}px;height:${size}px;background:${color};border-radius:2px;animation:bd-fall ${900 + Math.random()*500}ms ease-in forwards;animation-delay:${Math.random()*150}ms`;
    confettiZone.appendChild(piece);
    setTimeout(() => piece.remove(), 1600);
  }
}
function runReel(unit, finalDigit, flipCount, interval, onDone){
  let step = 0;
  function next(){
    step++;
    const isLast = step === flipCount;
    const digit = isLast ? finalDigit : Math.floor(Math.random() * 10);
    unit.flipTo(digit, isLast ? interval + 60 : interval, () => {
      if (isLast) { onDone(); } else { next(); }
    });
  }
  next();
}
renderHistory();
btn.addEventListener('click', () => {
  const avoid = document.getElementById('noRepeat').checked;
  const pool = avoid ? Array.from({length:120}, (_,i)=>i+1).filter(n => !picked.includes(n)) : Array.from({length:120}, (_,i)=>i+1);
  if (pool.length === 0) {
    btn.textContent = 'All picked';
    btn.disabled = true;
    return;
  }
  btn.disabled = true;
  const choice = pool[Math.floor(Math.random()*pool.length)];
  const digitsStr = String(choice).padStart(4,'0');
  const counts = [10, 20, 30, 40];
  let finishedCount = 0;
  digitUnits.forEach((unit, i) => {
    const digit = parseInt(digitsStr[i], 10);
    runReel(unit, digit, counts[i], 140, () => {
      finishedCount++;
      if (finishedCount === 4) {
        picked.push(choice);
        localStorage.setItem('backyardPicked', JSON.stringify(picked));
        renderHistory();
        btn.disabled = false;
        btn.textContent = 'Spin for a winner';
        burstConfetti();
      }
    });
  });
});
</script>
